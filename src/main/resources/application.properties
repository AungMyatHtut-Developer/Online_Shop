spring.application.name=Online_Shop

server.port=8083

spring.servlet.multipart.max-file-size=2MB
# Leave room for the other form fields and multipart encoding.
spring.servlet.multipart.max-request-size=3MB

spring.datasource.url=jdbc:mysql://localhost:3306/online_shop
spring.datasource.username=root
spring.datasource.password=root

# Create missing tables and update the schema from JPA entities at startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
