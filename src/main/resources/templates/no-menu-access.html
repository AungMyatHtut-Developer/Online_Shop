<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace access | Online Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260922-4')}">
    <link rel="stylesheet" th:href="@{/css/portal.css(v='20260924-1')}">
</head>
<body class="portal-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <aside th:replace="~{fragments/portal :: sidebar('workspace')}"></aside>
    <div class="portal-workspace">
        <header th:replace="~{fragments/portal :: topbar('Workspace')}"></header>
        <main id="main-content" class="portal-content" tabindex="-1">
            <div class="success-message" th:if="${success}" th:text="${success}" role="status"></div>
            <section class="empty-state"><span class="eyebrow">YOUR WORKSPACE</span><h1>No menu access yet</h1><p>Your assigned roles do not currently grant access to any workspace menus. Contact your administrator to update your permissions.</p><a class="button button-outline" th:href="@{/account/password}">Change password</a></section>
        </main>
    </div>
</body>
</html>
