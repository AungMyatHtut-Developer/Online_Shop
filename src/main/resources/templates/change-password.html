<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password | Online Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260922-4')}">
    <link rel="stylesheet" th:href="@{/css/portal.css(v='20260923-2')}">
</head>
<body class="portal-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <aside th:replace="~{fragments/portal :: sidebar('account')}"></aside>
    <div class="portal-workspace">
        <header th:replace="~{fragments/portal :: topbar('Password')}"></header>
        <main id="main-content" class="portal-content product-editor" tabindex="-1">
            <div class="page-heading"><div>
                <span class="eyebrow">YOUR ACCOUNT</span>
                <h1 th:text="${session.mustChangePassword} ? 'Set your password' : 'Change password'">Change password</h1>
                <p th:text="${session.mustChangePassword} ? 'Replace your temporary password to enter the portal.' : 'Choose a new password for your account.'"></p>
            </div></div>
            <form class="product-form" th:action="@{/account/password}" method="post">
                <input type="hidden" name="portalToken" th:value="${session.portalToken}">
                <div class="error-message" th:if="${errors}" role="alert"><p th:each="error : ${errors}" th:text="${error}"></p></div>
                <input type="hidden" name="username" th:value="${session.loggedInUser}" autocomplete="username">
                <div class="form-field">
                    <label for="currentPassword" th:text="${session.mustChangePassword} ? 'Temporary password' : 'Current password'">Current password</label>
                    <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required>
                </div>
                <div class="form-field">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{6,128}" aria-describedby="password-help" required>
                    <span id="password-help" class="field-help">6 to 128 characters, including a number, a lowercase letter and an uppercase letter.</span>
                </div>
                <div class="form-field">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
                </div>
                <div class="form-actions">
                    <a class="button button-outline" th:href="@{/products}" th:unless="${session.mustChangePassword}">Cancel</a>
                    <button class="button button-primary" type="submit" th:text="${session.mustChangePassword} ? 'Save and enter portal' : 'Change password'">Change password</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
